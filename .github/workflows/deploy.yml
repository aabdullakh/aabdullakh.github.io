name: Deploy to GitHub Pages

on:
  # Build and deploy on every push to main.
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

# Allow this job to clone the repo and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---- Post narration (the "Listen" player) ----
      # Kokoro turns each post into an MP3. Finished MP3s are kept in the
      # Actions cache, so only new or edited posts are narrated on each push.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore narration cache
        uses: actions/cache@v4
        with:
          path: |
            public/audio
            src/data/audio.json
          # A new key every run (caches can't be overwritten), restoring the latest one.
          key: narration-${{ github.run_id }}
          restore-keys: narration-

      - name: Narrate posts
        # If narration fails, the site still deploys; posts without audio just hide the player.
        continue-on-error: true
        timeout-minutes: 45
        run: npm run audio

      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
